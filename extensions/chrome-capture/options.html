<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Screenshot Capture - Settings</title>
  <style>
    :root {
      --bg-primary: #1F1F1F;
      --bg-secondary: #2D2D2D;
      --bg-tertiary: #252525;
      --text-primary: #E8E8E8;
      --text-secondary: #A8A8A8;
      --text-muted: #666666;
      --border-color: #3A3A3A;
      --border-light: #4A4A4A;
      --accent-color: #FFD700;
      --accent-hover: #FFE55C;
    }

    body[data-theme="light"] {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F5F5F5;
      --bg-tertiary: #FAFAFA;
      --text-primary: #333333;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border-color: #E0E0E0;
      --border-light: #D0D0D0;
      --accent-color: #1B4EF5;
      --accent-hover: #3874FF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 30px;
      color: var(--accent-color);
    }

    .settings-group {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
    }

    .setting-description {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* 토글 스위치 */
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 28px;
      background: var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      border: 1px solid var(--border-light);
      transition: all 0.3s;
    }

    .toggle-switch.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .toggle-slider {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 12px;
      transition: left 0.3s;
    }

    .toggle-switch.active .toggle-slider {
      left: 22px;
      background: var(--bg-primary);
    }

    .status-message {
      font-size: 12px;
      color: #4caf50;
      margin-top: 10px;
      display: none;
    }

    .status-message.show {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .language-buttons {
      display: flex;
      gap: 8px;
    }

    .lang-btn {
      padding: 8px 14px;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      background: var(--bg-primary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .lang-btn:hover {
      border-color: var(--accent-color);
    }

    .lang-btn.active {
      background: var(--accent-color);
      color: var(--bg-primary);
      border-color: var(--accent-color);
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <h1 data-i18n="settings-title">⚙️ 설정</h1>

  <div class="settings-group">
    <div class="setting-row">
      <div>
        <div class="setting-label" data-i18n="dark-mode">🌙 다크모드</div>
        <div class="setting-description" data-i18n="dark-mode-desc">어두운 테마로 변경</div>
      </div>
      <div class="toggle-switch active" id="themeToggle">
        <div class="toggle-slider"></div>
      </div>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-label" data-i18n="language">🌐 언어</div>
        <div class="setting-description" data-i18n="language-desc">한국어 / English</div>
      </div>
      <div class="language-buttons">
        <button class="lang-btn active" data-lang="ko" data-i18n="lang-ko">한국어</button>
        <button class="lang-btn" data-lang="en" data-i18n="lang-en">English</button>
      </div>
    </div>
  </div>

  <div class="status-message" id="statusMessage" data-i18n="status-save">✓ 설정이 저장되었습니다</div>

  <div class="footer">
    <span data-i18n="version">Smart Screenshot Capture v1.0.0</span><br>
    <span data-i18n="copyright">© 2026 All rights reserved</span>
  </div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
