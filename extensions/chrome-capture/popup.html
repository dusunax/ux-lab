<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Screenshot Capture</title>
  <style>
    :root {
      /* 다크모드 (기본) */
      --bg-primary: #1F1F1F;
      --bg-secondary: #2D2D2D;
      --bg-tertiary: #252525;
      --text-primary: #E8E8E8;
      --text-secondary: #A8A8A8;
      --text-muted: #666666;
      --border-color: #3A3A3A;
      --border-light: #4A4A4A;
      --accent-color: #FFD700;
      --accent-hover: #FFE55C;
      --status-bg: #3A3A3A;
    }

    body[data-theme="light"] {
      /* 라이트모드 */
      --bg-primary: #FFFFFF;
      --bg-secondary: #F5F5F5;
      --bg-tertiary: #FAFAFA;
      --text-primary: #333333;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border-color: #E0E0E0;
      --border-light: #D0D0D0;
      --accent-color: #1B4EF5;
      --accent-hover: #3874FF;
      --status-bg: #F0F4FF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
    }

    .container {
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      color: var(--accent-color);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      transition: color 0.3s;
    }

    .section {
      background: var(--bg-secondary);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      transition: background 0.3s, border-color 0.3s;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 9px 11px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      transition: all 0.2s;
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-color);
      background: var(--bg-secondary);
      box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.1);
    }

    body[data-theme="light"] input[type="text"]:focus {
      box-shadow: 0 0 0 2px rgba(27, 78, 245, 0.1);
    }

    button {
      padding: 9px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .btn-primary {
      background: var(--accent-color);
      color: var(--bg-primary);
      flex: 1;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      flex: 1;
      border: 1px solid var(--border-light);
    }

    .btn-secondary:hover {
      background: var(--status-bg);
      border-color: var(--accent-color);
    }

    .btn-reset-icon {
      background: var(--bg-secondary);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      font-weight: 600;
      padding: 9px 10px;
      min-width: 40px;
    }

    .btn-reset-icon:hover {
      background: var(--status-bg);
    }

    .hidden-elements {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      min-height: 28px;
    }

    .tag {
      background: var(--bg-secondary);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-color);
      border: 1px solid var(--border-light);
    }

    .tag-remove {
      cursor: pointer;
      font-weight: bold;
      color: var(--accent-color);
      transition: all 0.2s;
      font-size: 14px;
    }

    .tag-active {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.25);
    }

    body[data-theme="light"] .tag-active {
      box-shadow: 0 0 0 2px rgba(27, 78, 245, 0.2);
    }

    .tag-remove:hover {
      transform: scale(1.3);
    }

    .status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 10px;
      padding: 9px 11px;
      background: var(--status-bg);
      border-radius: 4px;
      text-align: center;
      border-left: 2px solid transparent;
      transition: all 0.2s;
      min-height: 24px;
      display: block;
    }

    .status:empty {
      display: none;
      margin: 0;
      padding: 0;
    }

    .status.success {
      background: #2D4A2D;
      color: #A0D995;
      border-left-color: #6BA35F;
    }

    body[data-theme="light"] .status.success {
      background: #E8F5E9;
      color: #2e7d32;
      border-left-color: #4caf50;
    }

    .status.error {
      background: #4A2D2D;
      color: #D99595;
      border-left-color: #A35F5F;
    }

    body[data-theme="light"] .status.error {
      background: #FFEBEE;
      color: #c62828;
      border-left-color: #f44336;
    }

    .status.warning {
      background: #4A3A2D;
      color: #D9B595;
      border-left-color: #A37F5F;
    }

    body[data-theme="light"] .status.warning {
      background: #FFF3E0;
      color: #e65100;
      border-left-color: #ff9800;
    }

    /* Preview 섹션 */
    .preview-section {
      display: none;
    }

    .preview-section.active {
      display: block;
    }

    .preview-image-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .preview-image {
      display: block;
      width: 100%;
      border-radius: 4px;
      max-height: 250px;
      object-fit: contain;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      cursor: zoom-in;
    }

    .zoom-lens {
      position: absolute;
      display: none;
      pointer-events: none;
      border: 2px solid var(--accent-color);
      border-radius: 50%;
      background-repeat: no-repeat;
      background-color: var(--bg-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .preview-info {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding: 9px 11px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      border-left: 2px solid var(--accent-color);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-download {
      background: var(--accent-color);
      color: var(--bg-primary);
      flex: 1;
    }

    .btn-download:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-cancel {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      font-weight: 600;
      flex: 0.5;
    }

    .btn-cancel:hover {
      background: var(--status-bg);
      border-color: var(--accent-color);
    }

    .memory-info {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    kbd {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 3px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 10px;
      color: var(--accent-color);
      display: inline-block;
    }

  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h1 style="margin-bottom: 0;">📸 Smart Screenshot</h1>
      <button id="optionsBtn" style="
        background: var(--bg-secondary);
        color: var(--accent-color);
        border: 1px solid var(--border-light);
        padding: 6px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.2s;
        min-width: auto;
        flex: none;
      " title="설정">⚙️</button>
    </div>

    <!-- 요소 숨기기 섹션 -->
    <div class="section" id="editorSection">
      <div class="section-title" data-i18n="hide-elements">숨길 요소</div>
      <div class="input-group">
        <input
          type="text"
          id="selectorInput"
          placeholder="CSS selector (e.g., .navbar, #sidebar)"
          data-i18n-placeholder="css-selector-placeholder"
        >
        <button class="btn-primary" id="addBtn" data-i18n="add">추가</button>
        <button class="btn-reset-icon" id="resetBtn" title="초기화" data-i18n-title="reset">🔄</button>
      </div>

      <div class="input-group">
        <button class="btn-secondary" id="pickBtn" data-i18n="pick-element" style="flex:1;">🎯 요소 선택</button>
      </div>

      <div id="hiddenElementsList" class="hidden-elements"></div>
      <div id="status" class="status"></div>
    </div>

    <!-- 캡처 섹션 -->
    <div class="section" id="captureSection">
      <div class="section-title" data-i18n="capture-section">캡처</div>
      <div class="input-group">
        <button class="btn-primary" id="captureBtn" data-i18n="capture-btn">⛶ 현재 탭 캡처</button>
      </div>
    </div>

    <!-- Preview 섹션 -->
    <div class="section preview-section" id="previewSection">
      <div class="section-title" data-i18n="preview-section">미리보기</div>
      <div class="preview-image-wrapper">
        <img id="previewImage" class="preview-image" alt="Preview">
        <div id="previewZoomLens" class="zoom-lens"></div>
      </div>
      <div class="preview-info">
        <div data-i18n="preview-ready">✓ 스크린샷이 준비되었습니다</div>
        <div id="previewSize"></div>
      </div>
      <div class="btn-group">
        <button class="btn-download" id="downloadBtn" data-i18n="download">💾 다운로드</button>
        <button class="btn-cancel" id="cancelBtn" data-i18n="cancel">취소</button>
      </div>
    </div>


  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
